{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MangaVogue</title>
    <link rel="stylesheet" href="{% static 'accounts/css/style.css' %}">
</head>
<body class="auth-body">
    <div class="bg-photo"></div>
    <div class="bg-overlay"></div>

    <main class="auth-shell">
        <section class="auth-card home-card">
            <div class="home-body">
                <h1 class="form-title home-title">You're logged in</h1>
                <p class="home-copy">Signed in as <strong>{{ user.username }}</strong>.</p>

                <form method="post" action="{% url 'logout' %}">
                    {% csrf_token %}
                    <button type="submit" class="btn-primary">Log out</button>
                </form>
            </div>
        </section>
    </main>
</body>
</html>
